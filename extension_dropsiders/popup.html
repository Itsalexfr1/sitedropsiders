<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      padding: 16px;
      background: linear-gradient(135deg, #111, #000);
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
    .header h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ff1241;
      font-style: italic;
    }
    .content {
      padding: 16px;
    }
    .news-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .news-card:hover {
      border-color: #ff1241;
      transform: translateY(-2px);
    }
    .news-card img {
      width: 100%;
      height: 120px;
      object-cover: cover;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .news-card h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      color: #fff;
    }
    .news-card .date {
      font-size: 10px;
      color: #666;
      margin-top: 4px;
      text-transform: uppercase;
      font-weight: 900;
    }
    .footer {
      padding: 12px;
      text-align: center;
      border-top: 1px solid #222;
    }
    .btn-site {
      display: inline-block;
      padding: 8px 16px;
      background: #ff1241;
      color: white;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #loading {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.png" alt="Logo">
    <h1>Dropsiders</h1>
  </div>
  <div class="content">
    <div id="loading">Chargement...</div>
    <div id="news-container"></div>
  </div>
  <div class="footer">
    <a href="https://dropsiders.fr" target="_blank" class="btn-site">Ouvrir le site</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
