<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Escape Psycho Circus – Saturday October 31</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#000;display:flex;justify-content:center;min-height:100vh}
.poster{
  width:880px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0f0000 0%,#050000 60%,#000 100%);
  font-family:'Oswald',sans-serif;
}
.bg-atmo{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 28% at 50% 0%, rgba(220,60,0,.6) 0%, transparent 70%),
    radial-gradient(ellipse 60% 20% at 50% 0%, rgba(255,120,0,.35) 0%, transparent 55%),
    radial-gradient(ellipse 30% 14% at 50% 2%, rgba(255,180,60,.2) 0%, transparent 50%);
}
.bg-svg{position:absolute;top:0;left:0;width:100%;height:260px;z-index:1;pointer-events:none}
.poster-header{position:relative;z-index:5;text-align:center;padding:52px 0 20px}
.insomniac-logo{width:34px;height:34px;margin:0 auto 6px;background:radial-gradient(circle,#fff 22%,rgba(255,255,255,0) 50%);border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 12px rgba(255,200,100,.6);position:relative}
.insomniac-logo::after{content:'';position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:50%;background:#333;transform:translate(-50%,-50%)}
.insomniac-label{font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.6);text-transform:uppercase;margin-bottom:4px}
.escape-title{
  font-family:'Cinzel Decorative',cursive;font-weight:900;font-size:98px;line-height:.85;
  background:linear-gradient(180deg,#fff6a0 0%,#ffcc00 18%,#ff8800 45%,#cc3300 72%,#660000 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 30px rgba(255,100,0,.9)) drop-shadow(0 0 60px rgba(200,50,0,.5)) drop-shadow(4px 6px 0px rgba(0,0,0,.95));
  letter-spacing:4px;
}
.psycho-title{font-family:'Cinzel Decorative',cursive;font-weight:700;font-size:22px;color:#ffd700;letter-spacing:13px;text-shadow:0 0 14px rgba(255,170,0,.8),0 2px 4px rgba(0,0,0,.9);margin-top:4px}
.date-banner{margin:15px auto 0;padding:10px 80px;width:fit-content;background:linear-gradient(90deg,transparent,#6e0000 7%,#8a0005 30%,#8a0005 70%,#6e0000 93%,transparent);border-top:2.5px solid #c04030;border-bottom:2.5px solid #c04030;position:relative}
.date-banner::before,.date-banner::after{content:'◆';position:absolute;top:50%;transform:translateY(-50%);color:#c04030;font-size:12px}
.date-banner::before{left:8px}
.date-banner::after{right:8px}
.date-text{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:5px;color:#fff;text-shadow:0 0 20px rgba(255,90,0,.5),3px 3px 6px rgba(0,0,0,.95)}
.schedule-label{margin-top:7px;font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:#e4b800;letter-spacing:8px;text-shadow:0 0 8px rgba(220,160,0,.6)}
.sched-wrap{padding:0 8px 10px;position:relative;z-index:5}
.sched-flex{display:flex;width:100%}
.time-col{width:48px;flex-shrink:0;display:flex;flex-direction:column}
.time-col-top{height:56px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#e4a229;text-shadow:0 0 8px rgba(220,130,0,.7)}
.time-col-body{position:relative}
.tlabel{position:absolute;width:100%;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:13px;color:#e4a229;transform:translateY(-50%);text-shadow:0 0 6px rgba(200,110,0,.6)}
.stages{flex:1;display:flex;position:relative}
.hline-layer{position:absolute;top:56px;left:0;right:0;bottom:0;pointer-events:none;z-index:2}
.hline{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.13)}
.stage-col{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid rgba(0,0,0,.6)}
.stage-col:last-child{border-right:1px solid rgba(0,0,0,.6)}
.stage-hdr{height:56px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px;border-bottom:1px solid rgba(0,0,0,.7);border-top:1px solid rgba(255,255,255,.12)}
.stage-name{font-family:'Cinzel',serif;font-weight:700;font-size:10.5px;color:#fff;line-height:1.25;letter-spacing:.5px;text-shadow:1px 1px 4px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.8)}
.stage-body{position:relative}
.ab{position:absolute;left:1px;right:1px;overflow:hidden;border:1px solid rgba(0,0,0,.5);border-radius:1px;padding:3px 4px 2px;display:flex;flex-direction:column;justify-content:center;transition:filter .15s;cursor:default}
.ab:hover{filter:brightness(1.3);z-index:10}
.ab-time{font-family:'Oswald',sans-serif;font-size:8px;font-weight:400;color:#ffd060;line-height:1.2}
.ab-name{font-family:'Bebas Neue',sans-serif;font-size:11.5px;color:#fff;line-height:1.1;text-shadow:1px 1px 2px rgba(0,0,0,.8)}

/* Saturday Sewer District = orange (to differ from Friday's green) */
.s-bigtop    .stage-hdr{background:linear-gradient(180deg,#bf3e14,#7a1e08)}
.s-bigtop    .ab      {background:linear-gradient(180deg,#4a150a,#2a0a04)}
.s-sewer     .stage-hdr{background:linear-gradient(180deg,#b56212,#7a4008)}
.s-sewer     .ab      {background:linear-gradient(180deg,#4a2808,#2a1604)}
.s-feeding   .stage-hdr{background:linear-gradient(180deg,#1a7024,#0b4814)}
.s-feeding   .ab      {background:linear-gradient(180deg,#0c3a10,#061e08)}
.s-cage      .stage-hdr{background:linear-gradient(180deg,#880e0e,#5a0808)}
.s-cage      .ab      {background:linear-gradient(180deg,#360606,#1c0404)}
.s-warehouse .stage-hdr{background:linear-gradient(180deg,#9e8212,#6a5608)}
.s-warehouse .ab      {background:linear-gradient(180deg,#3a2e06,#1e1a02)}
.s-macabre   .stage-hdr{background:linear-gradient(180deg,#1a4aaa,#0e2e80)}
.s-macabre   .ab      {background:linear-gradient(180deg,#0a1e50,#060e30)}

.poster-footer{text-align:center;padding:14px 0 26px;position:relative;z-index:5}
.divider-line{width:80%;margin:0 auto 14px;height:1px;background:linear-gradient(90deg,transparent,#600000,transparent)}
.footer-event{font-family:'Bebas Neue',sans-serif;font-size:18px;color:#bbb;letter-spacing:5px}
.footer-sub{margin-top:5px;font-family:'Oswald',sans-serif;font-size:11px;color:#666;letter-spacing:4px}
</style>
</head>
<body>
<div class="poster">
  <div class="bg-atmo"></div>
  <svg class="bg-svg" viewBox="0 0 880 260" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="moon" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#ffcc80"/>
        <stop offset="30%"  stop-color="#e07030"/>
        <stop offset="65%"  stop-color="#902010"/>
        <stop offset="100%" stop-color="#380500"/>
      </radialGradient>
      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="rgba(220,80,0,.4)"/>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      </radialGradient>
      <pattern id="stripeL" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(-55)">
        <rect width="16" height="16" fill="#1e0000"/>
        <rect width="8"  height="16" fill="#8a0000"/>
      </pattern>
      <pattern id="stripeR" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="rotate(55)">
        <rect width="16" height="16" fill="#1e0000"/>
        <rect width="8"  height="16" fill="#8a0000"/>
      </pattern>
    </defs>
    <circle cx="440" cy="68" r="160" fill="url(#moonGlow)"/>
    <circle cx="440" cy="68" r="80"  fill="url(#moon)"/>
    <polygon points="0,260 110,260 110,90 55,10 0,90"      fill="url(#stripeL)"/>
    <polygon points="110,260 200,260 155,100 110,260"       fill="#2a0800" opacity=".85"/>
    <polygon points="200,260 260,260 220,130 200,260"       fill="#1e0000" opacity=".7"/>
    <line x1="55"  y1="10" x2="55"  y2="0" stroke="#c03000" stroke-width="3"/>
    <line x1="155" y1="100" x2="155" y2="90" stroke="#902010" stroke-width="2"/>
    <polygon points="880,260 770,260 770,90 825,10 880,90"  fill="url(#stripeR)"/>
    <polygon points="770,260 680,260 725,100 770,260"       fill="#2a0800" opacity=".85"/>
    <polygon points="680,260 620,260 660,130 680,260"       fill="#1e0000" opacity=".7"/>
    <line x1="825" y1="10" x2="825" y2="0" stroke="#c03000" stroke-width="3"/>
    <line x1="725" y1="100" x2="725" y2="90" stroke="#902010" stroke-width="2"/>
    <polyline points="290,0 282,45 295,45 280,100" stroke="rgba(255,240,180,.7)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <polyline points="580,0 590,40 578,40 592,95"  stroke="rgba(255,240,180,.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <g fill="#050000" opacity=".8">
      <ellipse cx="200" cy="42" rx="11" ry="5" transform="rotate(-25,200,42)"/>
      <ellipse cx="215" cy="40" rx="10" ry="4.5" transform="rotate(20,215,40)"/>
      <ellipse cx="650" cy="52" rx="11" ry="5"  transform="rotate(20,650,52)"/>
      <ellipse cx="665" cy="50" rx="10" ry="4.5" transform="rotate(-18,665,50)"/>
    </g>
  </svg>

  <div class="poster-header">
    <div class="insomniac-label">INSOMNIAC</div>
    <div class="insomniac-logo"></div>
    <div class="escape-title">ESCAPE</div>
    <div class="psycho-title">PSYCHO CIRCUS</div>
    <div class="date-banner"><div class="date-text">SATURDAY OCTOBER 31</div></div>
    <div class="schedule-label">HORAIRES &bull; SCHEDULE</div>
  </div>

  <div class="sched-wrap">
    <div class="sched-flex" id="grid"></div>
  </div>

  <div class="poster-footer">
    <div class="divider-line"></div>
    <div class="footer-event">HALLOWEEN WEEKEND</div>
    <div class="footer-sub">SOUTHERN CALIFORNIA &bull; 18+</div>
  </div>
</div>

<script>
const PX = 1.6;
const START_H = 16;
function toMin(t){const[h,m]=t.split(':').map(Number);return(h<12?h+24:h)*60+(m||0);}
const BASE=START_H*60;
const GRID_H=600*PX;
function yTop(t){return(toMin(t)-BASE)*PX;}
function yHgt(s,e){return Math.max(35,(toMin(e)-toMin(s))*PX);}

const STAGES=[
  {id:'s-bigtop',name:'THE\nBIG TOP',artists:[
    {n:'LUMI',       s:'16:00',e:'17:00'},
    {n:'TELYKAST',   s:'17:00',e:'18:00'},
    {n:'JOYRYDE',    s:'18:00',e:'19:00'},
    {n:'IAN ASHER',  s:'19:00',e:'20:00'},
    {n:'MADDIX',     s:'20:00',e:'21:00'},
    {n:'ALOK',       s:'21:00',e:'22:15'},
    {n:'GALANTIS',   s:'22:15',e:'23:25'},
    {n:'DISCOLINES', s:'23:25',e:'00:45'},
    {n:'ZEDD',       s:'00:45',e:'02:00'},
  ]},
  {id:'s-sewer',name:'SEWER\nDISTRICT',artists:[
    {n:'ACYAN',           s:'16:00',e:'16:40'},
    {n:'ERO808',          s:'16:40',e:'17:40'},
    {n:'JON CASEY',       s:'17:40',e:'18:40'},
    {n:'KNOW GOOD',       s:'18:40',e:'19:40'},
    {n:'BOU',             s:'19:40',e:'20:40'},
    {n:'DR. FRESCH',      s:'20:40',e:'21:40'},
    {n:'ADVENTURE CLUB',  s:'21:40',e:'22:45'},
    {n:'LIQUID STRANGER', s:'22:45',e:'23:45'},
    {n:'TOO SHORT',       s:'23:45',e:'00:15'},
    {n:'JA RULE',         s:'00:15',e:'00:50'},
    {n:'DABIN',           s:'00:50',e:'02:00'},
  ]},
  {id:'s-feeding',name:'FEEDING\nGROUNDS',artists:[
    {n:'CAT & MAOMI',      s:'16:00',e:'17:00'},
    {n:'PEDROZ',           s:'17:00',e:'18:00'},
    {n:'ROMMII',           s:'18:00',e:'19:00'},
    {n:'ANDRUSS B2B JUOS', s:'19:00',e:'20:15'},
    {n:'GIRL MATH',        s:'20:15',e:'21:30'},
    {n:'AC SLATER',        s:'21:30',e:'23:00'},
    {n:'SAN PACHO',        s:'23:00',e:'00:30'},
    {n:'OMNOM',            s:'00:30',e:'02:00'},
  ]},
  {id:'s-cage',name:'THE\nCAGE',artists:[
    {n:'JSMN',                       s:'16:00',e:'17:15'},
    {n:'YANAMASTE',                  s:'17:15',e:'18:30'},
    {n:'FUNK ASSAULT',               s:'18:30',e:'20:00'},
    {n:'ALAN ASHER',                 s:'20:00',e:'21:30'},
    {n:'JSNN',                       s:'21:30',e:'23:00'},
    {n:'INDIRA PAGANOTTO',           s:'23:00',e:'00:30'},
    {n:'999999999',                  s:'00:30',e:'02:00'},
  ]},
  {id:'s-warehouse',name:'THE\nWAREHOUSE',artists:[
    {n:'CHRYSALIS',                   s:'16:00',e:'17:15'},
    {n:'ALEX CHAPMAN\nB2B ZOE GITTER',s:'17:15',e:'18:45'},
    {n:'SEDEF ADASI',                 s:'18:45',e:'20:00'},
    {n:'AVALON EMERSON',              s:'20:00',e:'21:20'},
    {n:'DJ HEARTSTRING',              s:'21:20',e:'22:30'},
    {n:'MALUGI',                      s:'22:30',e:'00:00'},
    {n:'MALUGI PRESENTS:\nMATTEO & FRIENDS',s:'00:00',e:'01:40'},
  ]},
  {id:'s-macabre',name:'DANSE\nMACABRE ☠',artists:[
    {n:'LANDOPOLO',      s:'16:00',e:'17:00'},
    {n:'$COE',           s:'17:00',e:'18:00'},
    {n:'DESA DECA',      s:'18:00',e:'19:00'},
    {n:'NINA J',         s:'19:00',e:'20:00'},
    {n:'RICHARD VISSION',s:'20:00',e:'21:00'},
    {n:'MARK LIZAOLA',   s:'21:00',e:'22:00'},
    {n:'SPENCY BE',      s:'22:00',e:'23:00'},
    {n:'SHAKING',        s:'23:00',e:'00:00'},
    {n:'MARIE NYX',      s:'00:00',e:'01:00'},
    {n:'TYKNI',          s:'01:00',e:'02:00'},
  ]},
];

const HOURS=[];
for(let i=0;i<=10;i++){const h=START_H+i;HOURS.push({label:String(h>=24?h-24:h).padStart(2,'0')+':00',y:i*60*PX});}

function makeTimeCol(){
  const col=document.createElement('div');col.className='time-col';
  const top=document.createElement('div');top.className='time-col-top';top.textContent='24H';col.appendChild(top);
  const body=document.createElement('div');body.className='time-col-body';body.style.cssText=`height:${GRID_H}px;position:relative;`;
  HOURS.forEach(({label,y})=>{const l=document.createElement('div');l.className='tlabel';l.style.top=y+'px';l.textContent=label;body.appendChild(l);});
  col.appendChild(body);return col;
}

const grid=document.getElementById('grid');
grid.appendChild(makeTimeCol());
const stages=document.createElement('div');stages.className='stages';

const hl=document.createElement('div');hl.className='hline-layer';
HOURS.forEach(({y})=>{const l=document.createElement('div');l.className='hline';l.style.top=y+'px';hl.appendChild(l);});
stages.appendChild(hl);

STAGES.forEach(stage=>{
  const col=document.createElement('div');col.className=`stage-col ${stage.id}`;
  const hdr=document.createElement('div');hdr.className='stage-hdr';
  const nm=document.createElement('div');nm.className='stage-name';nm.innerHTML=stage.name.replace('\n','<br>');
  hdr.appendChild(nm);col.appendChild(hdr);
  const body=document.createElement('div');body.className='stage-body';body.style.cssText=`height:${GRID_H}px;position:relative;`;
  stage.artists.forEach(({n,s,e})=>{
    const blk=document.createElement('div');blk.className='ab';
    const h=yHgt(s,e);blk.style.cssText=`top:${yTop(s)}px;height:${h}px;`;
    if(h>=44){const tl=document.createElement('div');tl.className='ab-time';tl.textContent=`${s} – ${e}`;blk.appendChild(tl);}
    const nl=document.createElement('div');nl.className='ab-name';if(h<38)nl.style.fontSize='9px';nl.innerHTML=n.replace('\n','<br>');blk.appendChild(nl);
    body.appendChild(blk);
  });
  col.appendChild(body);stages.appendChild(col);
});

grid.appendChild(stages);
grid.appendChild(makeTimeCol());
</script>
</body>
</html>
