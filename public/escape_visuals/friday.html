<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #060203;
  color: #fff;
  font-family: 'Oswald', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 24px 10px 60px;
  overflow-x: hidden;

/* TOP CONTROLS BAR */
.control-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 24px;
  background: rgba(20, 5, 8, 0.85);
  border: 1px solid rgba(255, 60, 0, 0.35);
  padding: 10px 24px;
  border-radius: 9999px;
  box-shadow: 0 0 30px rgba(255, 30, 0, 0.25);
  backdrop-filter: blur(12px);
  z-index: 100;
  position: sticky;
  top: 14px;
}
.tab-btn {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #aaa;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 19px;
  letter-spacing: 2px;
  padding: 8px 22px;
  border-radius: 9999px;
  cursor: pointer;
  transition: all 0.25s ease;
  text-decoration: none;
}
.tab-btn:hover {
  color: #fff;
  border-color: rgba(255, 120, 0, 0.6);
  background: rgba(255, 60, 0, 0.15);
}
.tab-btn.active {
  background: linear-gradient(135deg, #d92600, #ff6600);
  color: #fff;
  border-color: #ff9933;
  box-shadow: 0 0 18px rgba(255, 80, 0, 0.6);
}
.download-btn {
  background: linear-gradient(135deg, #10b981, #059669);
  border: 1px solid #34d399;
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  letter-spacing: 2px;
  padding: 8px 24px;
  border-radius: 9999px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.25s ease;
  box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
}
.download-btn:hover {
  transform: scale(1.04);
  box-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
}

/* ═══════════════════════════════════════════════
   POSTER CONTAINER (1080px Width for Clean 1080p Export)
   ═══════════════════════════════════════════════ */
.poster {
  width: 1040px;
  position: relative;
  background: #080102;
  border-radius: 8px;
  box-shadow: 0 0 70px rgba(0, 0, 0, 0.95), 0 0 30px rgba(180, 20, 0, 0.3);
  overflow: hidden;
  border: 1.5px solid rgba(255, 60, 0, 0.2);
}

/* BACKGROUND ATMOSPHERE */
.bg-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background: 
    radial-gradient(ellipse 95% 35% at 50% 0%, rgba(220, 50, 0, 0.65) 0%, transparent 70%),
    radial-gradient(circle at 82% 12%, rgba(255, 120, 0, 0.45) 0%, transparent 45%),
    radial-gradient(circle at 18% 12%, rgba(255, 50, 0, 0.35) 0%, transparent 45%),
    linear-gradient(180deg, #160203 0%, #0c0102 40%, #060101 100%);
}

/* SVG DECORATIONS (Moon, Circus Tents, Lightning, Flying Bats) */
.decor-svg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 380px;
  pointer-events: none;
  z-index: 1;
}

/* POSTER HEADER */
.poster-header {
  position: relative;
  z-index: 5;
  text-align: center;
  padding: 38px 20px 16px;
}

/* INSOMNIAC LOGO */
.insomniac-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-bottom: 4px;
}
.insomniac-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 14px rgba(255, 180, 50, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 20%, transparent 60%);
}
.insomniac-icon::after {
  content: '';
  width: 9px;
  height: 9px;
  background: #111;
  border-radius: 50%;
}
.insomniac-text {
  font-family: 'Oswald', sans-serif;
  font-size: 8px;
  letter-spacing: 4px;
  color: rgba(255, 255, 255, 0.65);
  text-transform: uppercase;
  margin-top: 3px;
}

/* 3D ESCAPE LOGO */
.escape-title {
  font-family: 'Cinzel Decorative', cursive;
  font-weight: 900;
  font-size: 106px;
  line-height: 0.85;
  letter-spacing: 5px;
  background: linear-gradient(180deg, #fff9c4 0%, #ffcc00 22%, #ff7700 50%, #d42200 78%, #6a0500 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: 
    drop-shadow(0 0 35px rgba(255, 100, 0, 0.9))
    drop-shadow(0 0 65px rgba(200, 40, 0, 0.5))
    drop-shadow(4px 6px 0px rgba(0, 0, 0, 0.95));
  margin-top: 2px;
}

/* PSYCHO CIRCUS RIBBON SUBTITLE */
.psycho-title {
  font-family: 'Cinzel Decorative', cursive;
  font-weight: 700;
  font-size: 24px;
  color: #ffca28;
  letter-spacing: 12px;
  text-shadow: 0 0 16px rgba(255, 180, 0, 0.85), 0 2px 5px rgba(0, 0, 0, 0.95);
  margin-top: 4px;
}

/* RED DISTRESSED DATE BANNER */
.date-banner-wrap {
  margin: 14px auto 0;
  width: fit-content;
}
.date-banner {
  padding: 8px 65px;
  background: linear-gradient(90deg, transparent 0%, #6e0000 10%, #940006 35%, #940006 65%, #6e0000 90%, transparent 100%);
  border-top: 2.5px solid #d93826;
  border-bottom: 2.5px solid #d93826;
  position: relative;
  box-shadow: 0 0 25px rgba(180, 0, 0, 0.5);
}
.date-banner::before, .date-banner::after {
  content: '◆';
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: #ff5533;
  font-size: 13px;
  text-shadow: 0 0 8px rgba(255, 100, 0, 0.8);
}
.date-banner::before { left: 16px; }
.date-banner::after { right: 16px; }

.date-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  letter-spacing: 6px;
  color: #ffffff;
  text-shadow: 0 0 22px rgba(255, 100, 0, 0.7), 2px 2px 4px rgba(0, 0, 0, 0.95);
}

.schedule-label {
  margin-top: 6px;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 700;
  color: #ffb703;
  letter-spacing: 9px;
  text-shadow: 0 0 10px rgba(255, 180, 0, 0.7);
}

   ═══════════════════════════════════════════════ */

}
.grid-flex {
  display: flex;
  width: 100%;
}

.time-col {

}
.time-col-hdr {

  justify-content: center;

  font-size: 18px;

  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(255, 130, 0, 0.7);
  border-bottom: 2px solid rgba(255, 255, 255, 0.15);
}
.time-col-body {
  position: relative;
}
.tlabel {
  position: absolute;
  width: 100%;
  text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  color: #ffa500;
  transform: translateY(-50%);
  letter-spacing: 0.5px;
  text-shadow: 0 0 6px rgba(200, 100, 0, 0.8), 1px 1px 2px rgba(0,0,0,0.9);
}

/* STAGES CONTAINER */
.stages-wrapper {
  flex: 1;
  display: flex;
  position: relative;
}

/* HORIZONTAL HOUR GUIDE LINES */
.hline-layer {
  position: absolute;
  top: 60px;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 2;
}
.hline {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: rgba(255, 255, 255, 0.12);
}
.hline-sub {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: rgba(255, 255, 255, 0.04);
}

/* STAGE COLUMN */
.stage-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  border-left: 1.5px solid rgba(0, 0, 0, 0.8);
}
.stage-col:last-child {
  border-right: 1.5px solid rgba(0, 0, 0, 0.8);
}

/* STAGE HEADER WITH ICONIC ESCAPE DESIGN */
.stage-hdr {
  height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4px 6px;
  border-bottom: 2px solid rgba(0, 0, 0, 0.95);
  box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  position: relative;
  z-index: 3;
}
.stage-name {
  font-family: 'Cinzel Decorative', 'Cinzel', serif;
  font-weight: 900;
  font-size: 11px;
  color: #ffffff;
  line-height: 1.15;
  letter-spacing: 0.5px;
  text-transform: uppercase;

}

/* STAGE BODY */

  position: relative;
}

/* ARTIST BLOCK */
.ab {
  position: absolute;
  left: 1.5px;
  right: 1.5px;
  overflow: hidden;
  border-radius: 2px;
  padding: 3px 4px 2px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  transition: transform 0.15s ease, filter 0.15s ease;
  cursor: pointer;
  box-shadow: inset 0 0 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.7);
  z-index: 4;
}
.ab:hover {
  filter: brightness(1.28);
  transform: scale(1.02);
  z-index: 20;
}
.ab-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13.5px;
  line-height: 1.05;
  letter-spacing: 0.5px;
  color: #ffffff;
  text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0,0,0,0.8);
  word-break: break-word;
}
.ab-time {
  font-family: 'Oswald', sans-serif;
  font-size: 8.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.85);
  line-height: 1.15;
  margin-top: 1px;
  letter-spacing: 0.3px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
}

/* ═══════════════════════════════════════════════

.s-feeding .stage-hdr {
  background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 60%, #0d3812 100%);

}

  background: linear-gradient(180deg, #2e7d32 0%, #1b5e20 100%);

.s-cage .stage-hdr {
  background: linear-gradient(180deg, #c62828 0%, #8e1515 60%, #5c0808 100%);

.s-warehouse .ab-name {

.s-macabre .stage-hdr {
  background: linear-gradient(180deg, #1565c0 0%, #0d47a1 60%, #062b66 100%);
  border-top: 2px solid #42a5f5;
}
.s-macabre .ab {
  background: linear-gradient(180deg, #1565c0 0%, #0d47a1 100%);
  border: 1px solid #1e88e5;
}

/* ═══════════════════════════════════════════════
   POSTER FOOTER (NO "ON SALE NOW!")

.poster-footer {
  text-align: center;

.footer-sub {

</style>
</head>

    // ═══════════════════════════════════════════════
    // TIMING & PROPORTIONAL GRID CALCULATION
    // ═══════════════════════════════════════════════
    const PX_PER_MIN = 1.48; // Pixels per minute
    const START_HOUR = 16;  // 16:00 (4:00 PM)
    const END_HOUR = 26;    // 02:00 AM next day (10 hours total = 600 min)
    const BASE_MIN = START_HOUR * 60; // 960 min
    const TOTAL_MIN = (END_HOUR - START_HOUR) * 60; // 600 min
    const GRID_HEIGHT = TOTAL_MIN * PX_PER_MIN; // ~888px

    function timeToMinutes(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const totalH = h < 12 ? h + 24 : h;
      return totalH * 60 + (m || 0);
    }

    function getYOffset(timeStr) {
      return (timeToMinutes(timeStr) - BASE_MIN) * PX_PER_MIN;
    }

    function getBlockHeight(startTime, endTime) {
      const dur = timeToMinutes(endTime) - timeToMinutes(startTime);
      return Math.max(34, dur * PX_PER_MIN);
    }

    // Convert 24h format to 12h AM/PM label
    function to12h(h24) {
      const h = h24 >= 24 ? h24 - 24 : h24;
      if (h === 0) return '12AM';
      if (h < 12) return h + 'AM';
      if (h === 12) return '12PM';
      return (h - 12) + 'PM';
    }

    function formatTimeLabel(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      const suffix = (h >= 12 && h < 24) ? 'PM' : 'AM';
      const displayH = h > 12 ? h - 12 : (h === 0 ? 12 : h);
      const displayM = m > 0 ? (':' + String(m).padStart(2, '0')) : '';
      return `${displayH}${displayM}${suffix}`;
    }

    // Generate Hourly Marks
    const HOURS_DATA = [];
    for (let h = START_HOUR; h <= END_HOUR; h++) {
      const y = (h - START_HOUR) * 60 * PX_PER_MIN;
      HOURS_DATA.push({
        h24: String(h >= 24 ? h - 24 : h).padStart(2, '0') + ':00',
        h12: to12h(h),
        y: y
      });
    }

    // Build Time Column (Left or Right)
    function createTimeColumn() {
      const col = document.createElement('div');
      col.className = 'time-col';

      const hdr = document.createElement('div');
      hdr.className = 'time-col-hdr';
      hdr.textContent = 'TIME';
      col.appendChild(hdr);

      const body = document.createElement('div');
      body.className = 'time-col-body';
      body.style.height = `${GRID_HEIGHT}px`;

      HOURS_DATA.forEach(({ h12, y }) => {
        const lbl = document.createElement('div');
        lbl.className = 'tlabel';
        lbl.style.top = `${y}px`;
        lbl.textContent = h12;
        body.appendChild(lbl);
      });

      col.appendChild(body);
      return col;
    }

    // Render Stage Columns and Artist Blocks
    function renderGrid(stagesData) {
      const container = document.getElementById('timetable-grid');
      container.innerHTML = '';

      // Left Time Axis
      container.appendChild(createTimeColumn());

      const stagesWrap = document.createElement('div');
      stagesWrap.className = 'stages-wrapper';

      // Horizontal Lines Layer
      const hlinesLayer = document.createElement('div');
      hlinesLayer.className = 'hline-layer';
      HOURS_DATA.forEach(({ y }) => {
        const line = document.createElement('div');
        line.className = 'hline';
        line.style.top = `${y}px`;
        hlinesLayer.appendChild(line);

        // Half hour sub-lines
        if (y + 30 * PX_PER_MIN < GRID_HEIGHT) {
          const sub = document.createElement('div');
          sub.className = 'hline-sub';
          sub.style.top = `${y + 30 * PX_PER_MIN}px`;
          hlinesLayer.appendChild(sub);
        }
      });
      stagesWrap.appendChild(hlinesLayer);

      // Render 6 Stages
      stagesData.forEach(stage => {
        const col = document.createElement('div');
        col.className = `stage-col ${stage.id}`;

        // Stage Header
        const hdr = document.createElement('div');
        hdr.className = 'stage-hdr';
        const nameEl = document.createElement('div');
        nameEl.className = 'stage-name';
        nameEl.innerHTML = stage.name.replace('\n', '<br>');
        hdr.appendChild(nameEl);
        col.appendChild(hdr);

        // Stage Body
        const body = document.createElement('div');
        body.className = 'stage-body';
        body.style.height = `${GRID_HEIGHT}px`;

        // Artist Blocks
        stage.artists.forEach(artist => {
          const block = document.createElement('div');
          block.className = 'ab';
          const top = getYOffset(artist.s);
          const height = getBlockHeight(artist.s, artist.e);

          block.style.top = `${top}px`;
          block.style.height = `${height}px`;

          // Artist Name
          const nameSpan = document.createElement('div');
          nameSpan.className = 'ab-name';
          if (height < 42 || artist.n.length > 20) {
            nameSpan.style.fontSize = '11px';
          }
          if (artist.n.length > 28) {
            nameSpan.style.fontSize = '9.5px';
          }
          nameSpan.innerHTML = artist.n.replace('\n', '<br>');
          block.appendChild(nameSpan);

          // Time range
          const timeSpan = document.createElement('div');
          timeSpan.className = 'ab-time';
          timeSpan.textContent = `${formatTimeLabel(artist.s)} - ${formatTimeLabel(artist.e)}`;
          block.appendChild(timeSpan);

          body.appendChild(block);
        });

        col.appendChild(body);
        stagesWrap.appendChild(col);
      });

      container.appendChild(stagesWrap);

      // Right Time Axis
      container.appendChild(createTimeColumn());
    }

    // Current State
    let currentDay = 'friday';

    function setDay(day) {
      currentDay = day;
      const headerDate = document.getElementById('header-date');
      const btnFriday = document.getElementById('btn-friday');
      const btnSaturday = document.getElementById('btn-saturday');

      if (day === 'friday') {
        headerDate.textContent = 'FRIDAY OCTOBER 30';
        btnFriday.classList.add('active');
        btnSaturday.classList.remove('active');
        renderGrid(FRIDAY_STAGES);
      } else {
        headerDate.textContent = 'SATURDAY OCTOBER 31';
        btnSaturday.classList.add('active');
        btnFriday.classList.remove('active');
        renderGrid(SATURDAY_STAGES);
      }
    }

    // Event Listeners
    document.getElementById('btn-friday').addEventListener('click', () => setDay('friday'));
    document.getElementById('btn-saturday').addEventListener('click', () => setDay('saturday'));

    document.getElementById('btn-download').addEventListener('click', async () => {
      const btn = document.getElementById('btn-download');
      const origText = btn.innerHTML;

      btn.style.opacity = '0.7';

      try {
        const posterEl = document.getElementById('capture-poster');
        const canvas = await html2canvas(posterEl, {
          scale: 2, // 2x ultra resolution
          useCORS: true,
          backgroundColor: '#080102'
        });

        const link = document.createElement('a');
        link.download = `escape_psycho_circus_${currentDay}_horaires.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error('Erreur export image:', err);
        alert('Erreur lors du téléchargement');
      } finally {
        btn.innerHTML = origText;
        btn.style.opacity = '1';
      }
    });
