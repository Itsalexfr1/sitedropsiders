
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Filtre Glow Top (Doux & Tubulaire, pas aveuglant) -->
    <filter id="glow-top" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filtre Glow Bottom -->
    <filter id="glow-bot" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b1" />
      <feGaussianBlur stdDeviation="12" result="b2" />
      <feMerge>
        <feMergeNode in="b2" />
        <feMergeNode in="b1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filtre Glitch / Palmiers -->
    <filter id="glow-palm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="pblur" />
      <feMerge>
        <feMergeNode in="pblur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;display=swap');
    .neon-font {
      font-family: 'Orbitron', -apple-system, sans-serif;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- LIGNES GLITCH HORIZONTALES DISCRETES -->
  <g filter="url(#glow-palm)">
    <rect x="240" y="100" width="130" height="2" fill="#00e1ff" opacity="0.85" />
    <rect x="580" y="145" width="70" height="2" fill="#ff2685" opacity="0.85" />
    <rect x="190" y="310" width="200" height="2" fill="#00e1ff" opacity="0.85" />
    <rect x="620" y="335" width="90" height="2.5" fill="#ff2685" opacity="0.85" />
    <rect x="360" y="240" width="50" height="1.5" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- PALMIER 1 (Grand à droite) -->
  <g transform="translate(1000, 310) scale(1.3)" filter="url(#glow-palm)">
    <!-- Tronc -->
    <path d="M-5,160 Q-12,70 -2,0 Q7,70 5,160" fill="none" stroke="#00e1ff" stroke-width="2.6" />
    <line x1="-9" y1="30" x2="6" y2="28" stroke="#ff2685" stroke-width="1.6" />
    <line x1="-11" y1="65" x2="7" y2="63" stroke="#ff2685" stroke-width="1.6" />
    <line x1="-12" y1="100" x2="8" y2="98" stroke="#ff2685" stroke-width="1.6" />
    <line x1="-10" y1="135" x2="7" y2="133" stroke="#ff2685" stroke-width="1.6" />

    <!-- Palmes -->
    <path d="M0,0 Q-40,-30 -85,-12" fill="none" stroke="#00e1ff" stroke-width="2.5" />
    <path d="M0,0 Q-50,-60 -80,-65" fill="none" stroke="#ff2685" stroke-width="2.5" />
    <path d="M0,0 Q-25,-85 -40,-105" fill="none" stroke="#00e1ff" stroke-width="2.5" />
    <path d="M0,0 Q10,-90 15,-115" fill="none" stroke="#ff2685" stroke-width="2.5" />
    <path d="M0,0 Q35,-85 55,-100" fill="none" stroke="#00e1ff" stroke-width="2.5" />
    <path d="M0,0 Q55,-55 90,-55" fill="none" stroke="#ff2685" stroke-width="2.5" />
    <path d="M0,0 Q50,-20 95,-8" fill="none" stroke="#00e1ff" stroke-width="2.5" />
  </g>

  <!-- PALMIER 2 (Petit à gauche du grand) -->
  <g transform="translate(870, 330) scale(0.95)" filter="url(#glow-palm)">
    <path d="M-4,150 Q-10,65 -2,0 Q6,65 4,150" fill="none" stroke="#ff2685" stroke-width="2.2" />
    <path d="M0,0 Q-35,-25 -75,-10" fill="none" stroke="#ff2685" stroke-width="2.2" />
    <path d="M0,0 Q-45,-50 -70,-55" fill="none" stroke="#00e1ff" stroke-width="2.2" />
    <path d="M0,0 Q-20,-75 -35,-95" fill="none" stroke="#ff2685" stroke-width="2.2" />
    <path d="M0,0 Q10,-80 12,-105" fill="none" stroke="#00e1ff" stroke-width="2.2" />
    <path d="M0,0 Q30,-75 48,-90" fill="none" stroke="#ff2685" stroke-width="2.2" />
    <path d="M0,0 Q50,-50 80,-50" fill="none" stroke="#00e1ff" stroke-width="2.2" />
  </g>

  <!-- TEXTE "NEW" (LETTRES CREUSES TUBULAIRES, FOND SOMBRE) -->
  <g transform="translate(480, 160)">
    <!-- Fond noir semi-transparent à l'intérieur des lettres -->
    <text class="neon-font" font-size="100" fill="#08080f" fill-opacity="0.8" stroke="none">
      NEW
    </text>

    <!-- Tube externe néon avec glow -->
    <text class="neon-font" font-size="100" fill="none" stroke="#ff2685" stroke-width="6" stroke-linejoin="round" filter="url(#glow-top)">
      NEW
    </text>

    <!-- Tube médian net -->
    <text class="neon-font" font-size="100" fill="none" stroke="#ff2685" stroke-width="3.5" stroke-linejoin="round">
      NEW
    </text>

    <!-- Filet central blanc fin (cœur du néon) -->
    <text class="neon-font" font-size="100" fill="none" stroke="#ffeef6" stroke-width="1.3" stroke-linejoin="round">
      NEW
    </text>
  </g>

  <!-- TEXTE DU BAS ("FOLLOWER", "SUB", etc.) -->
  <g transform="translate(480, 290)">
    <!-- Ombre décalée pour effet 3D relief -->
    <text class="neon-font" font-size="105" dx="4" dy="4" fill="none" stroke="#ff2685" stroke-width="4" stroke-linejoin="round" opacity="0.8" filter="url(#glow-top)">
      FOLLOWER
    </text>

    <!-- Intérieur sombre pour éviter l'éblouissement -->
    <text class="neon-font" font-size="105" fill="#050a12" fill-opacity="0.85" stroke="none">
      FOLLOWER
    </text>

    <!-- Tube néon cyan avec glow -->
    <text class="neon-font" font-size="105" fill="none" stroke="#00e1ff" stroke-width="6.5" stroke-linejoin="round" filter="url(#glow-bot)">
      FOLLOWER
    </text>

    <!-- Tube net cyan -->
    <text class="neon-font" font-size="105" fill="none" stroke="#00e1ff" stroke-width="3.5" stroke-linejoin="round">
      FOLLOWER
    </text>

    <!-- Filet cœur blanc clair -->
    <text class="neon-font" font-size="105" fill="none" stroke="#f0fdff" stroke-width="1.4" stroke-linejoin="round">
      FOLLOWER
    </text>
  </g>

</svg>
